<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sift News Brief</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#12151B">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sift">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,500..700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: a wire-desk column. Each story is a full-height panel ruled off like a newspaper
   column; the masthead stays slim; "what we filtered out" lives in Preferences and the end-of-deck screen. */
:root {
  --paper: #F4F5F7;
  --sheet: #FFFFFF;
  --ink: #12151B;
  --muted: #5A6372;
  --rule: #DADEE5;
  --accent: #2441C9;
  --alert: #C4331F;
  --accent-soft: #E6EAFB;
  --alert-soft: #FBE9E6;
  --display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1014; --sheet: #161920; --ink: #ECEEF2; --muted: #98A1B0; --rule: #272C35;
    --accent: #93A6FF; --alert: #FF7A63; --accent-soft: #1C2340; --alert-soft: #3A1E1A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1014; --sheet: #161920; --ink: #ECEEF2; --muted: #98A1B0; --rule: #272C35;
  --accent: #93A6FF; --alert: #FF7A63; --accent-soft: #1C2340; --alert-soft: #3A1E1A; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 400 16px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.app { max-width: 480px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; background: var(--sheet); overflow: clip;
  border-left: 1px solid var(--rule); border-right: 1px solid var(--rule); position: relative; }

/* Masthead */
.mast { padding: 12px 16px 0; border-bottom: 1px solid var(--rule); background: var(--sheet); }
.mast-row { display: flex; align-items: center; gap: 6px; }
.brand-wrap { flex: 1; display: flex; flex-direction: column; gap: 5px; }
.brand { font: italic 700 27px/1 var(--display); letter-spacing: -0.02em; }
.brand b { color: var(--accent); font-style: normal; }
.dateline { font: 500 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.icon-btn { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); }
.icon-btn:hover { background: var(--paper); color: var(--ink); }
.icon-btn svg { width: 19px; height: 19px; }


.tabs { display: flex; gap: 2px; align-items: center; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 10px 10px 11px; font: 500 14px/1 var(--body); color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.tab .n { font: 500 10.5px/1 var(--mono); margin-left: 4px; color: var(--muted); }
.tab .n.hot { color: var(--alert); }
.catch { margin-right: 4px; padding: 8px 13px; border-radius: 999px; font: 500 13px/1 var(--body); background: var(--ink); color: var(--sheet); white-space: nowrap; }

/* Feed */
main { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--paper); position: relative; overflow: clip; }
main.listmode { overflow-y: auto; display: block; }
main.listmode .card { position: relative; inset: auto; min-height: 0; padding: 22px 20px 18px; border-bottom: 1px solid var(--rule); display: flex; flex-direction: column;
  gap: 14px; background: var(--sheet); touch-action: auto; user-select: auto; -webkit-user-select: auto; transition: none; }
/* Deck */
.progress { display: flex; gap: 3px; padding: 10px 16px 0; }
.progress i { flex: 1; height: 3px; border-radius: 2px; background: var(--rule); transition: background .3s; }
.progress i.done { background: var(--ink); }
.progress i.now { background: var(--accent); }
.deckmeta { display: flex; justify-content: space-between; padding: 7px 18px 0; font: 500 11px/1.2 var(--mono); color: var(--muted); letter-spacing: .04em; }
.deck { position: relative; flex: 1; min-height: 0; margin: 10px 14px 0; }
.card { position: absolute; inset: 0; touch-action: pan-y; user-select: none; -webkit-user-select: none; will-change: transform;
  transition: transform .32s cubic-bezier(.2,.8,.2,1), opacity .32s; }
.card.dragging { transition: none; }
.card[data-depth="1"] { transform: translateY(12px) scale(.955); pointer-events: none; }
.card[data-depth="2"] { transform: translateY(24px) scale(.91); opacity: .6; pointer-events: none; }
.card[data-depth="3"] { transform: translateY(24px) scale(.91); opacity: 0; pointer-events: none; }
.flip { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.3,.7,.2,1); }
.card.flipped .flip { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--sheet); border: 1px solid var(--rule);
  border-radius: 18px; box-shadow: 0 10px 30px rgb(15 20 30 / .08), 0 1px 2px rgb(15 20 30 / .06); overflow-y: auto; padding: 18px 18px 16px;
  display: flex; flex-direction: column; gap: 12px; }
.face.back { transform: rotateY(180deg); gap: 0; }
.face { touch-action: pan-y; overscroll-behavior: contain; }
.bh { font: 600 20px/1.2 var(--display); margin: 10px 0 2px; text-wrap: balance; }
.bsec { padding: 12px 0; border-bottom: 1px solid var(--rule); }
.bsec:last-child { border-bottom: 0; }
.bsec h4 { margin: 0 0 5px; font: 500 10.5px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.bsec p { margin: 0; font-size: 15px; line-height: 1.5; }
.bsec .note { font-size: 12px; color: var(--muted); margin-top: 5px; }
.bsec .srclist { margin: 0; border-top: 0; }
.swipehint { display: flex; justify-content: space-between; padding: 9px 26px 0; font: 500 10.5px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.swipehint span:first-child { color: var(--alert); } .swipehint span:last-child { color: var(--accent); }
.ctlbar { display: flex; justify-content: space-around; padding: 6px 8px 10px; }
.cb { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 58px; padding: 7px 4px; border-radius: 10px; font: 500 11.5px/1 var(--body); color: var(--muted); text-decoration: none; }
.cb:hover { background: var(--sheet); color: var(--ink); }
.cb svg { width: 21px; height: 21px; }
.cb.on { color: var(--accent); }
.cb:disabled { opacity: .35; cursor: default; }
.sharegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 10px; }
.shr { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12.5px; text-decoration: none; color: var(--ink); padding: 6px 0; }
.shr b { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 700 17px/1 var(--body); }
.shr svg { width: 46px; height: 46px; padding: 12px; border-radius: 50%; background: var(--paper); }
.face .hl { font-size: 24.5px; }
.face .sum { font-size: 16px; }
.face-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 8px; border-top: 1px solid var(--rule); }
.hint { font: 500 10.5px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.stamp { position: absolute; top: 22px; z-index: 3; padding: 6px 10px; border: 2.5px solid; border-radius: 8px; font: 700 15px/1 var(--mono); letter-spacing: .08em;
  text-transform: uppercase; opacity: 0; pointer-events: none; background: var(--sheet); }
.stamp.yes { left: 18px; color: var(--accent); transform: rotate(-12deg); }
.stamp.no { right: 18px; color: var(--alert); transform: rotate(12deg); }
.heart { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 4; }
.heart svg { width: 96px; height: 96px; color: var(--accent); filter: drop-shadow(0 6px 16px rgb(0 0 0 / .2)); animation: pop .8s ease-out forwards; }
@keyframes pop { 0% { transform: scale(.2); opacity: 0; } 25% { transform: scale(1.15); opacity: 1; } 60% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.05); opacity: 0; } }
.controls { display: flex; justify-content: center; align-items: center; gap: 14px; padding: 14px 0 16px; }
.ctl { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; background: var(--sheet); border: 1px solid var(--rule);
  box-shadow: 0 3px 10px rgb(15 20 30 / .07); color: var(--muted); transition: transform .15s; }
.ctl:active { transform: scale(.92); }
.ctl svg { width: 22px; height: 22px; }
.ctl.big { width: 60px; height: 60px; }
.ctl.no { color: var(--alert); }
.ctl.yes { color: #fff; background: var(--accent); border-color: var(--accent); }
.ctl.sm { width: 42px; height: 42px; }
.ctl.sm svg { width: 18px; height: 18px; }
.ctl.on { color: var(--accent); border-color: var(--accent); }
.ctl:disabled { opacity: .35; cursor: default; }
.back-why { border-left: 2px solid var(--accent); padding-left: 12px; }
.back-why p { margin: 0; font: 500 19px/1.35 var(--display); }
.mini { font-size: 14px; }
.mini .claims li { grid-template-columns: 84px 1fr; font-size: 13.5px; }
.linkbtn { color: var(--accent); font-weight: 600; font-size: 14px; text-align: left; }
.coach { position: absolute; inset: 0; z-index: 15; background: rgb(10 12 16 / .72); color: #fff; display: grid; place-items: center; padding: 24px; text-align: center; }
.coach-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 14px; max-width: 320px; }
.coach-grid div { display: grid; gap: 6px; justify-items: center; font-size: 13.5px; line-height: 1.35; }
.coach-grid b { font: 600 26px/1 var(--display); }
.coach h3 { font: 600 24px/1.2 var(--display); margin: 0 0 18px; }
.coach .btn { margin-top: 22px; background: #fff; color: #12151B; }
/* End card + quiz */
.finish { position: absolute; inset: 0; overflow-y: auto; padding: 26px 22px 30px; display: flex; flex-direction: column; gap: 16px; }
.finish h2 { font: 600 32px/1.08 var(--display); margin: 0; text-wrap: balance; }
.finish .big { font: 600 54px/1 var(--display); color: var(--accent); font-variant-numeric: tabular-nums; }
.statrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 10px; }
.stat b { display: block; font: 600 26px/1 var(--display); font-variant-numeric: tabular-nums; }
.stat span { font: 500 10.5px/1.3 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.quiz { background: var(--sheet); border: 1px solid var(--rule); border-radius: 16px; padding: 16px; display: grid; gap: 10px; }
.quiz .qn { font: 500 10.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.quiz .q { font: 600 19px/1.25 var(--display); margin: 0; text-wrap: balance; }
.opt { text-align: left; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 10px; font-size: 15px; font-weight: 500; transition: .2s; }
.opt:hover:not(:disabled) { border-color: var(--muted); }
.opt.right { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.opt.wrong { border-color: var(--alert); background: var(--alert-soft); color: var(--alert); }
.opt:disabled { cursor: default; }
.qsrc { font-size: 13px; color: var(--muted); }
.btnrow { display: flex; gap: 10px; }
.btnrow .btn { flex: 1; }
/* Stories (Catch me up) */
.stories { position: absolute; inset: 0; z-index: 25; background: #0D1016; color: #F1F3F7; display: flex; flex-direction: column; user-select: none; -webkit-user-select: none; }
.stories .bars { display: flex; gap: 4px; padding: 14px 14px 0; }
.stories .bars i { flex: 1; height: 3px; border-radius: 2px; background: rgb(255 255 255 / .25); overflow: hidden; }
.stories .bars i b { display: block; height: 100%; width: 0; background: #fff; }
.stories .top { display: flex; align-items: center; padding: 12px 16px; gap: 10px; }
.stories .top .t { font: 500 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: rgb(255 255 255 / .7); flex: 1; }
.stories .top button { color: #fff; width: 34px; height: 34px; display: grid; place-items: center; }
.slide { flex: 1; padding: 10px 24px 30px; display: flex; flex-direction: column; justify-content: center; gap: 18px; animation: rise .45s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
.slide .sec-l { font: 500 12px/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: #9FB0FF; }
.slide h2 { font: 600 31px/1.1 var(--display); margin: 0; text-wrap: balance; }
.slide p { margin: 0; font-size: 16.5px; line-height: 1.5; color: rgb(255 255 255 / .82); }
.slide .num { font: 600 120px/0.8 var(--display); color: rgb(159 176 255 / .25); }
.slide .open { align-self: flex-start; padding: 10px 16px; border-radius: 999px; background: #fff; color: #0D1016; font-weight: 600; font-size: 14px; }
.slide .src { font: 400 12px/1.4 var(--mono); color: rgb(255 255 255 / .55); }
.stories .tapzones { position: absolute; inset: 70px 0 0; display: grid; grid-template-columns: 1fr 2fr; z-index: 1; }
.stories .slide .open { position: relative; z-index: 2; }
.paused { font: 500 11px/1 var(--mono); color: rgb(255 255 255 / .6); text-align: center; padding-bottom: 14px; min-height: 25px; }
.kicker { display: flex; align-items: center; gap: 10px; font: 500 11px/1.2 var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.idx { color: var(--muted); opacity: .7; }
.lab { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); }
.lab::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.lab-major::before { background: var(--accent); }
.lab-significant::before { background: var(--accent); opacity: .55; }
.lab-breaking { color: var(--alert); }
.lab-breaking::before { background: var(--alert); animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--alert) 18%, transparent); } }
.cat { font: 500 11px/1.3 var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-bottom: -6px; }
.hl { font: 600 27px/1.14 var(--display); font-variation-settings: "opsz" 40; letter-spacing: -0.012em; margin: 0; text-wrap: balance; }
.sum { margin: 0; font-size: 16.5px; line-height: 1.56; max-width: 65ch; }
.said { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.said li { display: grid; gap: 3px; }
.said .who { font: 500 11.5px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.said .what { font-size: 15.5px; line-height: 1.5; }
.saidmore { font-size: 13px; color: var(--muted); }
.srclist .d { display: block; grid-column: 1 / -1; font-size: 13.5px; line-height: 1.45; color: var(--muted); margin-top: 3px; }
.limited { font-size: 13.5px; line-height: 1.45; color: var(--muted); border: 1px dashed var(--rule); padding: 9px 11px; border-radius: 6px; }
.limited b { color: var(--ink); font-weight: 600; }
.why { border-left: 2px solid var(--accent); padding: 1px 0 1px 12px; }
.why-k { display: block; font: 500 10.5px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
.why p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--ink); }
.srcbtn { text-align: left; font-size: 13px; line-height: 1.45; color: var(--muted); display: block; }
.srcbtn strong { color: var(--ink); font-weight: 500; }
.srcbtn .chev { display: inline-block; font-family: var(--mono); margin-right: 6px; color: var(--ink); transition: transform .2s; }
.srcbtn[aria-expanded="true"] .chev { transform: rotate(90deg); }
.srclist { list-style: none; margin: -4px 0 0; padding: 0; border-top: 1px solid var(--rule); }
.srclist li { border-bottom: 1px solid var(--rule); }
.srclist a { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 9px 0; text-decoration: none; }
.srclist .p { font-weight: 500; font-size: 13.5px; }
.srclist .t { font: 400 11.5px/1.4 var(--mono); color: var(--muted); text-align: right; }
.srclist .h { grid-column: 1 / -1; font-size: 13px; color: var(--muted); line-height: 1.4; }
.tag { font: 500 9.5px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 3px 5px; border-radius: 3px; background: var(--paper); color: var(--muted); margin-left: 6px; vertical-align: 1px; }
.tag.op { background: var(--alert-soft); color: var(--alert); }
.actions { margin-top: auto; display: flex; gap: 4px; align-items: center; padding-top: 6px; border-top: 1px solid var(--rule); }
.act { display: inline-flex; align-items: center; gap: 6px; padding: 9px 9px; border-radius: 8px; font-size: 13.5px; font-weight: 500; color: var(--muted); text-decoration: none; }
.act:hover { background: var(--paper); color: var(--ink); }
.act svg { width: 17px; height: 17px; flex: none; }
.act.on { color: var(--accent); }
.act.primary { color: var(--ink); }
.act.more { margin-left: auto; }
.end { padding: 36px 24px 48px; text-align: center; color: var(--muted); font-size: 14px; }
.end b { display: block; font: 600 20px/1.25 var(--display); color: var(--ink); margin-bottom: 6px; }
.filterbar { display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-bottom: 1px solid var(--rule); font-size: 14px; }
.filterbar button { color: var(--accent); font-weight: 500; }

/* Sheets */
.scrim { position: absolute; inset: 0; background: rgb(10 12 16 / .38); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 88%; background: var(--sheet); border-radius: 16px 16px 0 0; z-index: 21;
  transform: translateY(102%); transition: transform .26s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; box-shadow: 0 -8px 30px rgb(0 0 0 / .14); }
.sheet.open { transform: none; }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px 10px; border-bottom: 1px solid var(--rule); }
.sheet-head h3 { margin: 0; font: 600 19px/1.2 var(--display); flex: 1; text-wrap: balance; }
.sheet-body { overflow-y: auto; padding: 6px 18px 26px; }
.sec { padding: 14px 0; border-bottom: 1px solid var(--rule); }
.sec:last-child { border-bottom: 0; }
.sec h4 { margin: 0 0 6px; font: 500 10.5px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sec p { margin: 0; font-size: 15px; line-height: 1.55; }
.sec .note { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.claims { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.claims li { display: grid; grid-template-columns: 92px 1fr; gap: 10px; font-size: 14px; line-height: 1.45; }
.kind { font: 500 9.5px/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 4px 6px; border-radius: 4px; align-self: start; text-align: center; background: var(--paper); color: var(--muted); }
.k-confirmed { background: var(--accent-soft); color: var(--accent); }
.k-official { background: var(--accent-soft); color: var(--accent); opacity: .85; }
.k-allegation { background: var(--alert-soft); color: var(--alert); }
.k-uncertain { border: 1px dashed var(--rule); background: none; }
.claims .src { display: block; font-size: 12px; color: var(--muted); }
.tl { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 1px solid var(--rule); display: grid; gap: 10px; }
.tl li { position: relative; font-size: 14px; line-height: 1.4; }
.tl li::before { content: ""; position: absolute; left: -18.5px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--sheet); border: 1.5px solid var(--muted); }
.tl li.future::before { border-style: dashed; }
.tl time { display: block; font: 500 11px/1.3 var(--mono); color: var(--muted); }
.tl .src { font-size: 12px; color: var(--muted); }
.bars { display: grid; gap: 7px; }
.bar { display: grid; grid-template-columns: 132px 1fr 34px; gap: 10px; align-items: center; font-size: 13px; }
.bar .track { display: block; height: 6px; background: var(--paper); border-radius: 3px; overflow: hidden; }
.bar .fill { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.bar .v { font: 500 12px/1 var(--mono); text-align: right; font-variant-numeric: tabular-nums; }

const IST = { timeZone: "Asia/Kolkata" };
function when(iso, precision) {

  if (precision === "day") return day;

/* ---------- ranking (mirrors newsintel/scoring + feed) ---------- */
const FEEDBACK_EFFECT = { relevant: 1, more_like_this: 1.5, not_relevant: -1, too_trivial: -0.75, too_repetitive: -0.5 };
function affinity() {
  const out = {}, now = Date.now();
  for (const f of P.feedback) {
    const e = FEEDBACK_EFFECT[f.kind]; if (!e) continue;
    const w = 0.08 * e * Math.pow(0.5, (now - f.at) / 864e5 / 14);
    for (const t of f.topics) out[t] = (out[t] || 0) + w;
  }
  for (const t in out) out[t] = Math.max(-0.35, Math.min(0.35, out[t]));
  return out;
}
function relevance(s, aff) {
  const topics = new Set(s.topics), why = [];
  if (P.excluded.some(t => topics.has(t))) return [0, ["Matches a topic you excluded"]];
  let best = 0;
  for (const i of P.interests) {
    const ov = (B.interests[i] || []).filter(t => topics.has(t)).length;
    if (!ov) continue;
    let st = 55 + 15 * Math.min(ov, 3);
    if (P.priority.includes(i)) { st *= 1.25; why.push("Priority interest: " + i); } else why.push("You follow " + i);
    best = Math.max(best, st);
  }
  const regions = new Set(s.regions && s.regions.length ? s.regions : ["World"]);
  if (topics.has("india")) regions.add("India");
  const rm = P.regions.filter(r => regions.has(r));
  if (rm.length) { best += 10; why.push("In a region you chose: " + rm.join(", ")); }
  let learned = s.topics.reduce((a, t) => a + (aff[t] || 0), 0);
  learned = Math.max(-0.35, Math.min(0.35, learned));
  if (Math.abs(learned) > 0.02) { best *= 1 + learned; why.push(learned > 0 ? "Adjusted by your feedback" : "Down-weighted by your feedback"); }
  if (P.followed.some(t => topics.has(t))) { best += 10; why.push("A topic you follow"); }
  return [Math.round(Math.max(0, Math.min(100, best)) * 10) / 10, why];
}
function scored() {
  const aff = affinity(), w = B.weights;
  return B.stories.filter(s => !P.hiddenStories.includes(s.id) && !s.sources.every(a => P.hiddenSources.includes(a.source_id)))
    .map(s => {
      const [rel, why] = relevance(s, aff);
      const parts = { importance: s.importance, relevance: rel, credibility: s.credibility, freshness: s.freshness, practical: s.practical };
      const score = Object.keys(parts).reduce((a, k) => a + w[k] * parts[k], 0);
      return { s, rel, why, parts, score: Math.round(score * 10) / 10 };
    }).sort((a, b) => b.score - a.score);
}
function yourFeed() {
  const cfg = B.feed_settings, ranked = scored().filter(r => r.score >= cfg.min_total_score);
  const n = Math.min(cfg.max_items, ranked.length), nGlobal = Math.round(n * (1 - P.personal));
  const picked = [], ids = new Set();
  ranked.filter(r => r.s.importance >= cfg.global_importance_floor && !P.excluded.some(t => r.s.topics.includes(t))).sort((a, b) => b.s.importance - a.s.importance)
    .slice(0, nGlobal).forEach(r => { picked.push(Object.assign({ slot: "global" }, r)); ids.add(r.s.id); });
  for (const r of ranked) { if (picked.length >= n) break; if (r.rel >= cfg.relevance_floor && !ids.has(r.s.id)) { picked.push(Object.assign({ slot: "personal" }, r)); ids.add(r.s.id); } }
  return picked.sort((a, b) => b.score - a.score);
}
/* Every story that passed the quality checks, newest first, with nothing personal filtered out. */
function allStories() {
  return scored().sort((a, b) => new Date(b.s.last_updated) - new Date(a.s.last_updated)).map(r => Object.assign({ slot: "all" }, r));
}
function important() {
  const all = scored();
  return all.filter(r => r.s.importance >= B.feed_settings.global_importance_floor).sort((a, b) => b.s.importance - a.s.importance).map(r => Object.assign({ slot: "global" }, r));
}
function catchUp() {
  const now = new Date(B.generated_at).getTime();
  const since = P.lastSeen && P.lastSeen < now ? P.lastSeen : now - 24 * 3600e3;
  const rows = scored(), fresh = rows.filter(r => new Date(r.s.last_updated).getTime() >= since);
  const top = fresh.slice().sort((a, b) => b.s.importance - a.s.importance).slice(0, 3);
  const worth = fresh.filter(r => !top.includes(r)).slice(0, 2);
  const used = new Set(top.concat(worth).map(r => r.s.id));
  const watch = rows.filter(r => r.s.status === "developing" && !used.has(r.s.id) && new Date(r.s.last_updated).getTime() >= now - 72 * 3600e3)
    .sort((a, b) => b.s.importance - a.s.importance).slice(0, 1);
  return { since, top, worth, watch, skipped: Math.max(0, fresh.length - top.length - worth.length - watch.length) };
}

    const seen = sameTab ? new Set(deck.rows.slice(0, deck.i).map(r => r.s.id)) : new Set();

/* ---------- live updates (server mode only) ---------- */
let pending = 0;
function liveUpdates() {
  if (!API || typeof EventSource !== "function") return;
  const es = new EventSource("/api/stream");
  const onEvent = async () => {
    const fresh = await (await fetch("/api/bundle")).json().catch(() => null); if (!fresh) return;
    const known = new Set(B.stories.map(s => s.id));
    pending += fresh.stories.filter(s => !known.has(s.id)).length;
    // replace data in place: open cards keep their position, developing stories get their new timeline
    B = fresh; masthead();
    showPill();
  };
  ["new_story", "development", "breaking"].forEach(t => es.addEventListener(t, onEvent));
}
/* Put new stories right after the card you're on. Nothing already in the deck is removed,
   and stories still in it pick up their latest version (new sources, updated timeline). */
function addNewStories() {
  const latest = new Map(B.stories.map(s => [s.id, s]));
  const old = deck.rows.map(r => latest.has(r.s.id) ? Object.assign({}, r, { s: latest.get(r.s.id) }) : r);
  const have = new Set(old.map(r => r.s.id));
  const added = rowsFor(tab).filter(r => !have.has(r.s.id));
  deck.rows = old.slice(0, deck.i).concat(added, old.slice(deck.i));
  deck.key = tab + "|" + (filter || "") + "|" + deck.rows.map(r => r.s.id).join(",");
  drawDeck(); document.getElementById("nAll").textContent = B.stories.length || "";
  toast(added.length ? added.length + (added.length === 1 ? " new story is" : " new stories are") + " next in your deck"
                     : "The new stories aren't in this tab. You'll find them under All");
}
function showPill() {
  let pill = document.getElementById("livePill");
  if (!pending) { if (pill) pill.remove(); return; }
  if (!pill) { pill = document.createElement("button"); pill.id = "livePill"; pill.className = "livepill"; view.appendChild(pill);
    pill.onclick = () => { pending = 0; pill.remove(); addNewStories(); }; }
  pill.textContent = "↑ " + pending + " new " + (pending === 1 ? "story" : "stories") + " · tap to add";
}
const IOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const INSTALLED = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
/* Returns a message for the user: alerts on, or what to do next. */
async function enablePush() {
  if (!API) return "Alerts work in the live app";
  if (IOS && !INSTALLED) return "On iPhone, first tap Share → Add to Home Screen, open Sift from the home screen, then turn alerts on";
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return "This browser can't show alerts";
  try {
    const { key } = await (await fetch("/api/push/key")).json(); if (!key) return "Alerts aren't set up on this server yet";
    if (await Notification.requestPermission() !== "granted") return "Allow notifications for Sift in your settings to get alerts";
    const reg = await navigator.serviceWorker.register("/sw.js"); await navigator.serviceWorker.ready;
    const raw = atob(key.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - key.length % 4) % 4));
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: Uint8Array.from(raw, c => c.charCodeAt(0)) });
    await api(U("/push"), { method: "POST", body: JSON.stringify(sub.toJSON()) });
    return "Alerts are on for this device";
  } catch (e) { return "Couldn't turn on alerts on this device"; }
}

const SLOT_LABEL = { morning: "Morning brief", afternoon: "Afternoon update", evening: "Evening wrap", extra: "Extra briefing" };
const fmt12 = t => { const [h, m] = t.split(":").map(Number); return ((h + 11) % 12 + 1) + ":" + String(m).padStart(2, "0") + (h < 12 ? " am" : " pm"); };
function briefProblems(list, channel, email) {
  const on = list.filter(d => d.on !== false).map(d => d.time);
  const p = [];
  if (on.some(t => !/^([01]\d|2[0-3]):[0-5]\d$/.test(t))) p.push("Pick a time for every briefing.");
  if (new Set(on).size !== on.length) p.push("Two briefings are set for the same time.");
  if (channel !== "push" && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email || "")) p.push("Enter a valid email address for email briefings.");
  return p;
}
function nextBriefing(list) {
  const now = new Date(B.generated_at), ist = new Date(now.toLocaleString("en-US", IST)), nowM = ist.getHours() * 60 + ist.getMinutes();
  const on = list.filter(d => d.on !== false && d.time).map(d => ({ d, m: +d.time.slice(0, 2) * 60 + +d.time.slice(3) })).sort((a, b) => a.m - b.m);
  return (on.find(x => x.m > nowM) || on[0] || {}).d;
}

  const lines = top.map(r => "• " + esc(r.s.headline)).join("<br>");

    (first ? "" : '<div class="sec"><h4>What we filtered out</h4><p class="note" style="margin:0 0 10px">On the last refresh Sift read ' + B.stats.articles_scanned +
      ' reports and kept ' + B.stats.stories_kept + ' stories. See everything it set aside, and why.</p><button class="btn ghost" id="pFiltered">See what we filtered out</button></div>') +
    '<div class="sec"><button class="btn" id="pDone">' + (first ? "Start reading" : "Done") + '</button></div>', body => {
      const pf = body.querySelector("#pFiltered"); if (pf) pf.onclick = () => filtered();
      if (!first) bindBrief(body, () => { const y = body.scrollTop; prefs(false); document.getElementById("sheetBody").scrollTop = y; });
      body.querySelectorAll("[data-i]").forEach(b => b.onclick = () => {
        const i = b.dataset.i, on = P.interests.includes(i), pr = P.priority.includes(i);
        if (!on) { P.interests.push(i); } else if (!pr) { P.priority.push(i); } else { P.interests = P.interests.filter(x => x !== i); P.priority = P.priority.filter(x => x !== i); }
        b.setAttribute("aria-pressed", String(P.interests.includes(i))); b.classList.toggle("prio", P.priority.includes(i));
      });
      const tog = (sel, key) => body.querySelectorAll(sel).forEach(b => b.onclick = () => {
        const v = b.dataset[sel.slice(6, 7)], has = P[key].includes(v);
        P[key] = has ? P[key].filter(x => x !== v) : P[key].concat(v); b.setAttribute("aria-pressed", String(!has));
      });
      tog("[data-r]", "regions"); tog("[data-x]", "excluded");
      body.querySelectorAll("[data-a]").forEach(b => b.onclick = async () => {
        P.alerts = b.dataset.a; body.querySelectorAll("[data-a]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
        if (P.alerts !== "off" && API) toast(await enablePush());
      });
      const rng = body.querySelector("#pB"); rng.oninput = () => { P.personal = rng.value / 100; body.querySelector("#pBv").textContent = rng.value + "% personal"; };
      const rs = body.querySelector("#pReset"); if (rs) rs.onclick = () => { P.followed = []; P.hiddenSources = []; P.hiddenStories = []; P.feedback = []; persist(); closeSheet(); render(); toast("Learned preferences cleared"); };
      body.querySelector("#pDone").onclick = () => {
        const bp = briefProblems(P.digests, P.digestChannel, P.email);
        if (bp.length) { toast(bp[0]); const bs = body.querySelector("#briefings"); if (bs) bs.scrollIntoView({ block: "start" }); return; }
        P.onboarded = true; persist(); closeSheet(); tab = "feed"; filter = null; deck.key = ""; render(); if (first) coach();
        api(U("/preferences"), { method: "PUT", body: JSON.stringify({ interests: P.interests, priority_interests: P.priority, excluded_topics: P.excluded, regions: P.regions, breaking_alerts: P.alerts, personal_share: P.personal,
          digests: P.digests, digest_channel: P.digestChannel, email: P.digestChannel === "push" ? null : P.email,
          timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Kolkata" }) })
          .then(r => r && r.json()).then(j => {
            if (!j) return;
            if (j.email_status === "confirmation_sent") toast("Check your inbox: tap the link we sent to start email briefings");
            else if (j.email_status === "email_not_configured") toast("Email briefings aren't set up on this server yet");
          }).catch(() => {});
      };
    });
}

/* ---------- events ---------- */
view.addEventListener("click", e => {
  const open = e.target.closest("[data-open]"); if (open) return prefs(false);
  const c = e.target.closest("[data-c]");
  if (c) {
    const r = deck.rows[deck.i];
    if (c.dataset.c === "back") return goBack();
    if (c.dataset.c === "share") return share(r.s);
    if (c.dataset.c === "more") return more(r);
    if (c.dataset.c === "no") return deskNotForMe();
    if (c.dataset.c === "save") {
      const on = !P.saved.includes(r.s.id);
      P.saved = on ? P.saved.concat(r.s.id) : P.saved.filter(x => x !== r.s.id); persist();
      api(U("/saved/" + r.s.id + "?saved=" + on), { method: "PUT" });
      c.classList.toggle("on", on); c.innerHTML = (on ? I.saved : I.save) + "<span>" + (on ? "Saved" : "Save") + "</span>"; c.setAttribute("aria-pressed", String(on));
      document.getElementById("nSaved").textContent = P.saved.length || "";
      return toast(on ? "Saved for later" : "Removed from saved");
    }
  }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const card = b.closest(".card"), r = findRow(card.dataset.id), s = r.s;
  const act = b.dataset.act;
  if (act === "sources") { const ul = card.querySelector(".srclist"); ul.hidden = !ul.hidden; b.setAttribute("aria-expanded", String(!ul.hidden)); }
  if (act === "explain") explain(s);
  if (act === "more") more(r);
  if (act === "save") {
    const on = !P.saved.includes(s.id);
    P.saved = on ? P.saved.concat(s.id) : P.saved.filter(x => x !== s.id); persist();
    api(U("/saved/" + s.id + "?saved=" + on), { method: "PUT" });
    b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on)); b.innerHTML = (on ? I.saved : I.save) + "<span>" + (on ? "Saved" : "Save") + "</span>";
    document.getElementById("nSaved").textContent = P.saved.length || "";
    toast(on ? "Saved" : "Removed from saved");
  }
  if (act === "share") share(s);
});
document.addEventListener("keydown", e => {
  if (sheet.classList.contains("open") || document.querySelector(".stories") || listMode) return;
  if (e.target.closest && e.target.closest("input,textarea")) return;
  if (isDesk() && view.querySelector(".dwrap")) {
    const k = e.key.toLowerCase();
    if (k === "arrowdown" || k === "j") { e.preventDefault(); deskOpen(deck.i + 1); }
    else if (k === "arrowup" || k === "k") { e.preventDefault(); deskOpen(deck.i - 1); }
    else if (k === "s") { const b = view.querySelector('[data-c="save"]'); if (b) b.click(); }
    else if (k === "x") deskNotForMe();
    return;
  }
  const top = view.querySelector('.card[data-depth="0"]');
  if (e.key === "ArrowRight" && top) { e.preventDefault(); swipe("yes"); }
  else if (e.key === "ArrowLeft" && top) { e.preventDefault(); swipe("no"); }
  else if ((e.key === " " || e.key === "Enter") && top && e.target === top) { e.preventDefault(); flip(top); }
  else if (e.key.toLowerCase() === "s" && top) { doubleTap(top); }
  else if (e.key.toLowerCase() === "z" || e.key === "Backspace") goBack();
});
document.querySelectorAll(".tab").forEach(t => t.onclick = () => { tab = t.dataset.tab; filter = null; render(); });
document.getElementById("catchBtn").onclick = showCatchUp;
document.getElementById("prefsBtn").onclick = () => prefs(false);
document.getElementById("themeBtn").onclick = () => {
  const dark = getComputedStyle(document.documentElement).colorScheme.includes("dark");
  P.theme = dark ? "light" : "dark"; document.documentElement.dataset.theme = P.theme; persist();
};
document.getElementById("viewBtn").onclick = () => { listMode = !listMode; document.getElementById("viewBtn").innerHTML = listMode ? IC.cards : IC.list; render(); };

/* ---------- boot ---------- */
function masthead() {
  const g = new Date(B.generated_at);
  document.getElementById("dateline").textContent = g.toLocaleDateString("en-IN", Object.assign({ day: "numeric", month: "short" }, IST)) +
    " · " + g.toLocaleTimeString("en-IN", Object.assign({ hour: "2-digit", minute: "2-digit", hour12: false }, IST)) + " IST";
  if (!API) { const n = document.getElementById("snapnote"); n.hidden = false; n.textContent = "Snapshot of real reports · " + when(B.generated_at) + " · all cards link to sources"; }
}
if (API && "serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
(async function boot() {
  if (P.theme) document.documentElement.dataset.theme = P.theme;
  try { B = SNAP || await (await fetch("/api/bundle")).json(); }
  catch (e) { view.innerHTML = '<div class="end"><b>Could not load the news.</b>Check your connection and reload the page.</div>'; return; }
  masthead(); render(); liveUpdates();
  const shared = openSharedStory();
  if (location.hash === "#briefings" && P.onboarded) { prefs(false); setTimeout(() => { const b = document.getElementById("briefings"); if (b) b.scrollIntoView(); }, 300); }
  if (!P.onboarded && !shared) setTimeout(() => prefs(true), 350); else if (!shared) coach();
})();
</script>
</body>
</html>
